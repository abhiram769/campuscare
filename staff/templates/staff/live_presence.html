
{% if user.is_authenticated and user.role == 'STAFF' %}
    {% if is_working_day and today_attendance and today_attendance.check_in and not today_attendance.check_out %}

    <script>
    (function () {
        // Prevent duplicate heartbeat scripts.
        if (window.campusPresenceStarted) {
            return;
        }
        window.campusPresenceStarted = true;

        const heartbeatUrl = "{% url 'staff_heartbeat' %}";
        const csrfToken = "{{ csrf_token }}";

        async function sendHeartbeat() {
            if (document.hidden) {
                return;
            }

            try {
                const response = await fetch(heartbeatUrl, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken,
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                if (!response.ok) {
                    console.warn(
                        'Heartbeat rejected. HTTP status:',
                        response.status
                    );
                }
            } catch (error) {
                console.warn('Presence update failed:', error);
            }
        }

        // Send the first heartbeat.
        sendHeartbeat();

        // Update presence once per minute.
        const heartbeatInterval = setInterval(sendHeartbeat, 60000);

        // Update presence when the user returns to the tab.
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                sendHeartbeat();
            }
        });

        // Stop the timer if the page is being unloaded.
        window.addEventListener('beforeunload', function () {
            clearInterval(heartbeatInterval);
        });

    })();
    </script>

    {% endif %}
{% endif %}

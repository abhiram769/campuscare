
<style>
    #notification-popup {
        position: fixed;
        top: 75px;
        right: 20px;
        z-index: 99999;
        width: 340px;
        max-width: calc(100vw - 30px);
    }

    .notification-item {
        background: white;
        color: #333;
        padding: 16px;
        margin-bottom: 12px;
        border-radius: 10px;
        border-left: 5px solid #198754;
        box-shadow: 0 4px 15px rgba(0,0,0,0.18);
        animation: notificationSlide 0.3s ease;
    }

    .notification-item strong {
        display: block;
        margin-bottom: 6px;
        color: #198754;
    }

    .notification-item p {
        margin-bottom: 8px;
        overflow-wrap: anywhere;
    }

    .notification-item a {
        color: #198754;
        font-weight: 600;
        text-decoration: none;
    }

    .notification-item a:hover {
        text-decoration: underline;
    }

    @keyframes notificationSlide {
        from {
            opacity: 0;
            transform: translateX(30px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    #notification-badge {
        display: none;
        min-width: 19px;
        padding: 3px 6px;
        margin-left: 4px;
        border-radius: 20px;
        background: #dc3545;
        color: white;
        font-size: 11px;
        font-weight: bold;
        text-align: center;
        vertical-align: middle;
    }

    #enable-notification-sound {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100000;
        border: none;
        border-radius: 8px;
        background: #198754;
        color: white;
        padding: 10px 16px;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    #enable-notification-sound:hover {
        background: #146c43;
    }
</style>


<div id="notification-popup"></div>


<button id="enable-notification-sound" type="button">

    <i class="bi bi-volume-up"></i>
    Enable Notification Sound

</button>


<script>
(function () {

    // Prevent duplicate WebSocket connections.
    if (window.campusNotificationStarted) {
        return;
    }

    window.campusNotificationStarted = true;

    const popup = document.getElementById(
        'notification-popup'
    );

    const soundButton = document.getElementById(
        'enable-notification-sound'
    );

    let unreadCount = 0;
    let audioContext = null;
    let soundEnabled = false;
    let socket = null;
    let reconnectDelay = 2000;


    // -----------------------------------------
    // UPDATE NOTIFICATION BADGE
    // -----------------------------------------

    function updateBadge() {

        const badge = document.getElementById(
            'notification-badge'
        );

        if (!badge) {
            return;
        }

        if (unreadCount > 0) {

            badge.textContent =
                unreadCount > 99 ? '99+' : unreadCount;

            badge.style.display = 'inline-block';

        } else {

            badge.style.display = 'none';

        }
    }


    // -----------------------------------------
    // ENABLE NOTIFICATION SOUND
    // -----------------------------------------

    async function enableNotificationSound() {

        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {

            alert('Your browser does not support audio.');

            return;
        }

        try {

            if (!audioContext) {
                audioContext = new AudioContextClass();
            }

            await audioContext.resume();

            soundEnabled = true;

            soundButton.innerHTML =
                '<i class="bi bi-volume-up-fill"></i> Sound Enabled';

            soundButton.style.background = '#0d6efd';

            // Play a test tone.
            playNotificationSound();

            console.log('Notification sound enabled.');

        } catch (error) {

            console.error('Unable to enable sound:', error);

        }
    }


    soundButton.addEventListener(
        'click',
        enableNotificationSound
    );


    // -----------------------------------------
    // PLAY NOTIFICATION SOUND
    // -----------------------------------------

    function playNotificationSound() {

        if (!soundEnabled || !audioContext) {
            return;
        }

        if (audioContext.state !== 'running') {
            return;
        }

        try {

            const oscillator = audioContext.createOscillator();

            const gain = audioContext.createGain();

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.type = 'sine';

            oscillator.frequency.setValueAtTime(
                880,
                audioContext.currentTime
            );

            oscillator.frequency.setValueAtTime(
                1174,
                audioContext.currentTime + 0.12
            );

            gain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.25,
                audioContext.currentTime + 0.02
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime + 0.35
            );

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 0.4
            );

        } catch (error) {

            console.error('Sound playback error:', error);

        }
    }


    // -----------------------------------------
    // SHOW NOTIFICATION POPUP
    // -----------------------------------------

    function showNotification(data) {

        unreadCount++;

        updateBadge();

        playNotificationSound();

        const item = document.createElement('div');

        item.className = 'notification-item';

        const closeButton = document.createElement('button');

        closeButton.type = 'button';
        closeButton.className = 'btn-close float-end';
        closeButton.setAttribute('aria-label', 'Close');

        closeButton.addEventListener('click', function () {
            item.remove();
        });

        const title = document.createElement('strong');

        title.innerHTML =
            '<i class="bi bi-bell-fill"></i> New Notification';

        const message = document.createElement('p');

        message.textContent =
            data.message || 'You have a new notification.';

        item.appendChild(closeButton);
        item.appendChild(title);
        item.appendChild(message);

        if (data.link) {

            const link = document.createElement('a');

            link.href = data.link;
            link.textContent = 'View Details';

            item.appendChild(link);
        }

        popup.prepend(item);

        setTimeout(function () {

            item.remove();

        }, 8000);

    }


    // -----------------------------------------
    // WEBSOCKET CONNECTION
    // -----------------------------------------

    function connectWebSocket() {

        const protocol =
            window.location.protocol === 'https:' ? 'wss://' : 'ws://';

        socket = new WebSocket(
            protocol + window.location.host + '/ws/notifications/'
        );


        socket.onopen = function () {

            console.log('Notification WebSocket connected.');

            reconnectDelay = 2000;

        };


        socket.onmessage = function (event) {

            try {

                const data = JSON.parse(event.data);

                showNotification(data);

            } catch (error) {

                console.error('Invalid notification:', error);

            }

        };


        socket.onerror = function (error) {

            console.error('Notification WebSocket error:', error);

        };


        socket.onclose = function () {

            console.log('Notification WebSocket disconnected.');

            // Reconnect if the page is still open.
            setTimeout(function () {

                reconnectDelay = Math.min(
                    reconnectDelay * 2,
                    30000
                );

                connectWebSocket();

            }, reconnectDelay);

        };

    }


    // Start WebSocket connection.
    connectWebSocket();


    // -----------------------------------------
    // RESET BADGE WHEN REQUESTED
    // -----------------------------------------

    window.resetCampusNotificationCount = function () {

        unreadCount = 0;

        updateBadge();

    };


})();
</script>


<script>
(function () {
    const monitorUrl = "{% url 'admin_assignment_monitor' %}";

    async function checkOfflineAssignments() {
        try {
            const response = await fetch(monitorUrl, {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            if (!response.ok) {
                return;
            }

            const data = await response.json();

            if (data.success && data.reassigned > 0) {
                console.info(
                    'Campus Care automatically reassigned',
                    data.reassigned,
                    'offline task(s).'
                );
            }

        } catch (error) {
            console.error(
                'Assignment monitoring request failed:',
                error
            );
        }
    }

    // Check immediately when the dashboard opens.
    checkOfflineAssignments();

    // Check again every 20 seconds.
    window.setInterval(checkOfflineAssignments, 20000);
})();
</script>
